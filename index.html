  <script>
    // Typing Animation
    var roles = ["Software Engineer", "CAD Developer", "AI Enthusiast", "a Physics grad turned software developer"];
    var roleIndex = 0, charIndex = 0, isDeleting = false;
    var typingEl = document.getElementById("typing-text");

    function typeRole() {
      if (!typingEl) return;
      var current = roles[roleIndex];
      if (isDeleting) {
        typingEl.textContent = current.substring(0, charIndex - 1);
        charIndex--;
      } else {
        typingEl.textContent = current.substring(0, charIndex + 1);
        charIndex++;
      }
      var delay = isDeleting ? 40 : 80;
      if (!isDeleting && charIndex === current.length) {
        delay = 2000; isDeleting = true;
      } else if (isDeleting && charIndex === 0) {
        isDeleting = false;
        roleIndex = (roleIndex + 1) % roles.length;
        delay = 400;
      }
      setTimeout(typeRole, delay);
    }
    typeRole();

    // Mobile Nav
    var navToggle = document.getElementById("nav-toggle");
    var navMenu = document.getElementById("nav-menu");
    if (navToggle && navMenu) {
      navToggle.addEventListener("click", function() { navMenu.classList.toggle("active"); });
    }
  </script>
